<div id="contact" class="pt-5" style="background: #000; color: #fff; min-height: 60vh;">
    <div class="container">
        <div class="row align-items-start">
            <!-- Left Side: Info & Social -->
            <div class="col-md-6 mb-4">
                <h1 class="display-4 mb-4" style="font-weight: 300;">Get in touch<br>with me!</h1>
                <div class="mb-3">
                    <i class="bi bi-envelope-paper-fill me-2"></i>
                    <span style="font-size: 1.2rem; color: #bdbdbd;">parwejalamgt&#64;gmail.com</span>
                </div>
                <div class="mb-4" data-aos="fade-right" data-aos-easing="ease-in-sine">
                    @for(link of icons; let i = $index; track $index) {
                    <a [href]="link.href" class="me-2"><i class="{{link.icon}}"
                            style="font-size:2.2rem; color:#4285f4;"></i></a>
                    }
                </div>
                <a href="#" class="btn btn-danger btn-lg px-4" style="font-size:1.7rem;">Download CV</a>
            </div>
            <!-- Right Side: Form -->
            <div class="col-md-6">
                <form>
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg" placeholder="Full Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control form-control-lg" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control form-control-lg" rows="5"
                            placeholder="Type your message in minimum 20 words!" required></textarea>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg"
                            style="background:#2856a7; border:none;">SEND</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <div class="mt-5 pt-4 pb-2" style="background: #aab2bd; color: #444;">
        <div class="container text-center">
            <h2 style="font-weight: 300;">Parwej Alam</h2>
            <div class="mb-2">
                <i class="bi bi-envelope-paper-fill me-2"></i>
                <span>parwejalamgt&#64;gmail.com</span>
            </div>
            <div class="mb-2" data-aos="fade-down" data-aos-easing="ease-in-sine">
                @for(link of icons; let i = $index; track $index) {
                <a [href]="link.href" class="me-2"><i class="{{link.icon}}"
                        style="font-size:2.2rem; color:#4285f4;"></i></a>
                }
            </div>
            <div class="mb-1" style="font-size:1.1rem;">
                &copy; {{year}} copyright all right reserved
            </div>
        </div>
    </div>
</div>
